name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep linux_x64.tar.gz | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --verbose
      - name: forbidden paths and large files
        run: |
          bad=$(git ls-files | grep -E '(^|/)(evidence|traces|renders|eval-runs)/|\.(db|sqlite)$|(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "forbidden paths:"; echo "$bad"; exit 1; fi
          big=$(git ls-files -z | xargs -0 -I{} find {} -maxdepth 0 -type f -size +1M)
          if [ -n "$big" ]; then echo "files over 1 MiB:"; echo "$big"; exit 1; fi
